services:
  gateway:
    build: { context: ., dockerfile: apps/gateway/Dockerfile }
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      IDENTITY_PROPERTY_URL: http://identity-property:4001/graphql
      SAFETY_OPERATIONS_URL: http://safety-operations:4002/graphql
      COMMUNICATION_PROVIDER_URL: http://communication-provider:4003/graphql
    depends_on: [identity-property, safety-operations, communication-provider]

  identity-property:
    build: { context: ., dockerfile: apps/identity-property/Dockerfile }
    ports: ["4001:4001"]
    environment:
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GUEST_APP_URL: ${GUEST_APP_URL}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@identity-property-db:27017/identity_property?authSource=admin
    depends_on: [identity-property-db]

  identity-property-db:
    image: mongo:8
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: identity_property
    volumes: ["identity_property_data:/data/db"]

  safety-operations:
    build: { context: ., dockerfile: apps/safety-operations/Dockerfile }
    ports: ["4002:4002"]
    environment:
      PORT: 4002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@safety-operations-db:27017/safety_operations?authSource=admin
      IDENTITY_PROPERTY_URL: http://identity-property:4001/graphql
    depends_on: [safety-operations-db]

  safety-operations-db:
    image: mongo:8
    ports: ["27018:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: safety_operations
    volumes: ["safety_operations_data:/data/db"]

  communication-provider:
    build: { context: ., dockerfile: apps/communication-provider/Dockerfile }
    ports: ["4003:4003"]
    environment:
      PORT: 4003
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@communication-provider-db:27017/communication_provider?authSource=admin
    depends_on: [communication-provider-db]

  communication-provider-db:
    image: mongo:8
    ports: ["27019:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: communication_provider
    volumes: ["communication_provider_data:/data/db"]

volumes:
  identity_property_data:
  safety_operations_data:
  communication_provider_data:
